name: Render OpenMotion MP4 (manual)

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project slug (e.g. places-worth-exploring-001-okinawa)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: openmotion-master-${{ github.ref }}-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-openmotion-npm-${{ hashFiles('package.json', 'bun.lock', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-openmotion-npm-

      - name: Restore generated media and speech models
        uses: actions/cache/restore@v4
        with:
          path: |
            .openmotion-cache/media
            .openmotion-cache/models
            ~/.cache/pip
          key: ${{ runner.os }}-openmotion-media-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-openmotion-media-v1-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi
      - name: Validate selected project
        env:
          WORLD_RENDER_PROJECT: ${{ inputs.project }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const s=process.env.WORLD_RENDER_PROJECT; if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(s)) throw Error("Invalid project slug"); const p=JSON.parse(fs.readFileSync("projects/"+s+"/project.json","utf8")); if(p.slug!==s || !p.scenes.some(x=>x.worldStory || x.catOffice || x.premiumTravel || x.bucketList?.documentary?.series==="places-worth-exploring" || (p.seriesId==="the-human-side" && x.doodle?.extras?.includes("human-side-v1")))) throw Error("Unsupported master project");'
      - name: Prepare project assets and Studio bundle
        run: npm run build
        env:
          OPENMOTION_REQUIRE_FFMPEG: '1'
          VITE_GITHUB_OWNER: ${{ github.repository_owner }}
          VITE_GITHUB_REPO: ${{ github.event.repository.name }}
      - name: Render selected H.264 AAC master
        run: npm run render:master
        env:
          WORLD_RENDER_PROJECT: ${{ inputs.project }}
      - name: Upload selected MP4
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-master
          path: dist/renders/${{ inputs.project }}.mp4
          if-no-files-found: error
          retention-days: 30
