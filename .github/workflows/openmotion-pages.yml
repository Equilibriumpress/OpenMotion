name: Deploy OpenMotion Library to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "openmotion-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-openmotion-npm-${{ hashFiles('package.json', 'bun.lock', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-openmotion-npm-

      - name: Restore generated media and speech models
        uses: actions/cache/restore@v4
        with:
          path: |
            .openmotion-cache/media
            .openmotion-cache/models
            ~/.cache/pip
          key: ${{ runner.os }}-openmotion-media-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-openmotion-media-v1-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi

      - name: Build OpenMotion manifest & static GitHub Pages bundle
        run: npm run build
        env:
          VITE_GITHUB_OWNER: ${{ github.repository_owner }}
          VITE_GITHUB_REPO: ${{ github.event.repository.name }}

      - name: Save verified generated media
        if: ${{ hashFiles('.openmotion-cache/media-changed') != '' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .openmotion-cache/media
            .openmotion-cache/models
            ~/.cache/pip
          key: ${{ runner.os }}-openmotion-media-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
